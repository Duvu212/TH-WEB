<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quản lý sinh viên</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>Quản lý sinh viên</h1>

    <!-- KHU VỰC NÚT -->
    <div class="top-bar">
      <button id="btnAddStudent">
        Thêm sinh viên
      </button>
    </div>

    <!-- THỐNG KÊ -->
    <div class="statistics">

      <p>
        Tổng số sinh viên:
        <span id="totalStudents">0</span>
      </p>

      <p>
        Điểm trung bình:
        <span id="averageScore">0</span>
      </p>

    </div>

    <!-- THÔNG BÁO -->
    <div id="message"></div>

    <!-- BẢNG -->
    <table>

      <thead>
        <tr>
          <th>Mã SV</th>
          <th>Họ tên</th>
          <th>Ngày sinh</th>
          <th>Lớp</th>
          <th>Điểm</th>
          <th>Email</th>
          <th>Hành động</th>
        </tr>
      </thead>

      <tbody id="studentTableBody">

        <tr>
          <td>SV001</td>
          <td>Nguyễn Văn Nam</td>
          <td>20/10/2003</td>
          <td>CNTT1</td>
          <td>8.5</td>
          <td>anguyen@gmail.com</td>
          <td>
            <button class="btn-edit">Sửa</button>
            <button class="btn-delete">Xóa</button>
          </td>
        </tr>

        
        <tr>
          <td>SV002</td>
          <td>Trần Thị Bích</td>
          <td>15/05/2004</td>
          <td>CNTT2</td>
          <td>7.2</td>
          <td>btran@gmail.com</td>
          <td>
            <button class="btn-edit">Sửa</button>
            <button class="btn-delete">Xóa</button>
          </td>
        </tr>

        
        <tr>
          <td>SV003</td>
          <td>Lê Hoàng Công</td>
          <td>02/09/2003</td>
          <td>ANMT</td>
          <td>9.0</td>
          <td>cle@gmail.com</td>
          <td>
            <button class="btn-edit">Sửa</button>
            <button class="btn-delete">Xóa</button>
          </td>
        </tr>

      </tbody>

    </table>

  </div>

  <!-- POPUP -->
  <div id="modal" class="modal hidden">

    <div class="modal-content">

      <h2 id="formTitle">
        Thêm sinh viên
      </h2>

      <form id="studentForm">

        <label>Mã sinh viên</label>
        <input type="text" id="studentId" required>

        <label>Họ tên</label>
        <input type="text" id="studentName" required>

        <label>Ngày sinh</label>
        <input type="date" id="studentBirth" required>

        <label>Lớp</label>
        <input type="text" id="studentClass" required>

        <label>Điểm</label>
        <input
          type="number"
          id="studentScore"
          min="0"
          max="10"
          step="0.1"
          required
        >

        <label>Email</label>
        <input type="email" id="studentEmail" required>

        <div class="form-actions">

          <button type="submit">
            Lưu
          </button>

          <button type="button" id="btnClose">
            Hủy
          </button>

        </div>

      </form>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
