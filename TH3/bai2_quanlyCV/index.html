<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quản lý công việc cá nhân</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>Quản lý công việc cá nhân</h1>

    <div class="top-bar">
      <button id="btnAddTask">Thêm công việc</button>
    </div>

    <div class="summary">
      <p>Tổng công việc: <span id="totalTasks">0</span></p>
      <p>Đã hoàn thành: <span id="completedTasks">0</span></p>
      <p>Chưa hoàn thành: <span id="uncompletedTasks">0</span></p>
    </div>

    <div id="message"></div>

    <div id="taskList" class="task-list">
      <!-- Công việc sẽ được render bằng JavaScript -->
    </div>

  </div>

  <!-- POPUP FORM -->
  <div id="modal" class="modal hidden">

    <div class="modal-content">

      <h2 id="formTitle">Thêm công việc</h2>

      <form id="taskForm">

        <label>Tiêu đề công việc</label>
        <input type="text" id="taskTitle" required>

        <label>Mô tả ngắn</label>
        <textarea id="taskDescription" required></textarea>

        <label>Hạn hoàn thành</label>
        <input type="date" id="taskDeadline" required>

        <label>Mức ưu tiên</label>
        <select id="taskPriority" required>
          <option value="">-- Chọn mức ưu tiên --</option>
          <option value="Thấp">Thấp</option>
          <option value="Trung bình">Trung bình</option>
          <option value="Cao">Cao</option>
        </select>

        <div class="form-actions">
          <button type="submit" id="btnSave">Lưu</button>
          <button type="button" id="btnClose">Hủy</button>
        </div>

      </form>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
